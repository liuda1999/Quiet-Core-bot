services:
  - type: web
    name: quiet-core-bot
    runtime: docker
    plan: starter
    healthCheckPath: /health
    envVars:
      - key: QUIET_CORE_GATEWAY_PORT
        value: "8080"
      - key: QUIET_CORE_STATE_DIR
        value: /data/.quiet-core-bot
      - key: QUIET_CORE_WORKSPACE_DIR
        value: /data/workspace
      - key: QUIET_CORE_GATEWAY_TOKEN
        generateValue: true
    disk:
      name: quiet-core-bot-data
      mountPath: /data
      sizeGB: 1
