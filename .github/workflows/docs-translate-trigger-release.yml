name: Docs Trigger Translations On Release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  dispatch-translate:
    runs-on: ubuntu-latest
    env:
      QUIET_CORE_DOCS_SYNC_TOKEN: ${{ secrets.QUIET_CORE_DOCS_SYNC_TOKEN }}
    steps:
      - name: Skip translation dispatch without token
        if: env.QUIET_CORE_DOCS_SYNC_TOKEN == ''
        run: echo "QUIET_CORE_DOCS_SYNC_TOKEN is not configured; skipping translation dispatch."

      - name: Trigger translation coordinator in publish repo
        if: env.QUIET_CORE_DOCS_SYNC_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.QUIET_CORE_DOCS_SYNC_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          gh api repos/quiet-core-bot/docs/dispatches \
            --method POST \
            -f event_type="translate-all-release" \
            -f client_payload[mode]="incremental" \
            -f client_payload[release_tag]="${RELEASE_TAG}" \
            -f client_payload[source_repository]="${GITHUB_REPOSITORY}" \
            -f client_payload[source_sha]="${GITHUB_SHA}"
